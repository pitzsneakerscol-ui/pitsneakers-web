# Compilación de las apps en la nube (Codemagic), sin necesitar Mac ni Android Studio.
# iPhone: docs/app-store/README.md · Android: docs/play-store/README.md
workflows:
  ios-app-store:
    name: Pitsneakers iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Llave de la API de App Store Connect, agregada en Codemagic → Teams → Integrations con este nombre.
      app_store_connect: pitsneakers_asc
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pitsneakers.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.pitsneakers.app
    triggering:
      events: []
    scripts:
      - name: Instalar plugins de Capacitor y sincronizar iOS
        script: |
          cd mobile
          npm ci
          npx cap sync ios
      - name: Número de compilación automático
        script: |
          cd mobile
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((LATEST + 1))
          cd ios/App
          agvtool new-version -all "$NEXT"
      - name: Preparar firma (certificado y perfil de App Store)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project "mobile/$XCODE_PROJECT"
      - name: Compilar el .ipa
        script: |
          cd mobile
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # false = sube a TestFlight y tú decides cuándo enviar a revisión desde App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false

  android-play-store:
    name: Pitsneakers Android (Google Play)
    # Cuenta personal: linux_x2 exige facturación activa. mac_mini_m2 usa los 500 min gratis al mes y trae el SDK de Android.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      android_signing:
        # Llave de firma subida en Codemagic → Teams → Code signing identities → Android keystores, con este nombre.
        - pitsneakers_upload
      groups:
        # Grupo creado en Codemagic → app → Environment variables; contiene GOOGLE_SERVICES_JSON.
        - pitsneakers_android
    triggering:
      events: []
    scripts:
      - name: Instalar plugins de Capacitor y sincronizar Android
        script: |
          cd mobile
          npm ci
          npx cap sync android
      - name: Poner google-services.json (avisos push; variable GOOGLE_SERVICES_JSON de Codemagic)
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # Acepta el JSON pegado tal cual o codificado en base64.
            first=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | head -c 1)
            if [ "$first" = "{" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > mobile/android/app/google-services.json
            fi
            if ! python3 -c "import json,sys; json.load(open('mobile/android/app/google-services.json'))"; then
              echo "ERROR: GOOGLE_SERVICES_JSON no es un JSON valido. Vuelve a pegar el contenido de google-services.json en el grupo pitsneakers_android."
              exit 1
            fi
            echo "google-services.json listo"
          else
            echo "AVISO: falta GOOGLE_SERVICES_JSON; la app se compila pero no recibirá avisos push."
          fi
      - name: Compilar el .aab firmado
        script: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/mapping/release/mapping.txt
    # Para subir solo a "Prueba interna" en Play (después de la primera subida manual), quita el # de estas líneas
    # y agrega GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (JSON de la cuenta de servicio de Google Play) en Codemagic.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true
